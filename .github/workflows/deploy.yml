name: Digital Heroes Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Required CI gate
    uses: ./.github/workflows/ci.yml

  validate-deployment-config:
    name: Validate deployment configuration
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check required deployment placeholders are configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
          FRONTEND_PUBLIC_URL: ${{ vars.FRONTEND_PUBLIC_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          DEMO_ADMIN_ACCOUNTS: ${{ secrets.DEMO_ADMIN_ACCOUNTS }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=(VERCEL_TOKEN)
          [ -n "$VERCEL_ORG_ID" ] || missing+=(VERCEL_ORG_ID)
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=(VERCEL_PROJECT_ID)
          [ -n "$RAILWAY_TOKEN" ] || missing+=(RAILWAY_TOKEN)
          [ -n "$RAILWAY_PROJECT_ID" ] || missing+=(RAILWAY_PROJECT_ID)
          [ -n "$RAILWAY_ENVIRONMENT_ID" ] || missing+=(RAILWAY_ENVIRONMENT_ID)
          [ -n "$RAILWAY_SERVICE_ID" ] || missing+=(RAILWAY_SERVICE_ID)
          [ -n "$BACKEND_PUBLIC_URL" ] || missing+=(BACKEND_PUBLIC_URL)
          [ -n "$FRONTEND_PUBLIC_URL" ] || missing+=(FRONTEND_PUBLIC_URL)
          [ -n "$GEMINI_API_KEY" ] || missing+=(GEMINI_API_KEY)
          [ -n "$MONGODB_URI" ] || missing+=(MONGODB_URI)
           [ -n "$RAZORPAY_KEY_ID" ] || missing+=(RAZORPAY_KEY_ID)
           [ -n "$RAZORPAY_KEY_SECRET" ] || missing+=(RAZORPAY_KEY_SECRET)
           [ -n "$DEMO_ADMIN_ACCOUNTS" ] || missing+=(DEMO_ADMIN_ACCOUNTS)
           if [ -n "$GOOGLE_CLIENT_ID" ] && [ -z "$GOOGLE_CLIENT_SECRET" ]; then missing+=(GOOGLE_CLIENT_SECRET); fi
           if [ -n "$GOOGLE_CLIENT_SECRET" ] && [ -z "$GOOGLE_CLIENT_ID" ]; then missing+=(GOOGLE_CLIENT_ID); fi
           if [ -n "$GITHUB_CLIENT_ID" ] && [ -z "$GITHUB_CLIENT_SECRET" ]; then missing+=(GITHUB_CLIENT_SECRET); fi
           if [ -n "$GITHUB_CLIENT_SECRET" ] && [ -z "$GITHUB_CLIENT_ID" ]; then missing+=(GITHUB_CLIENT_ID); fi
           if [ -n "$DEMO_ADMIN_ACCOUNTS" ] && ! node -e 'const accounts = JSON.parse(process.env.DEMO_ADMIN_ACCOUNTS); if (!Array.isArray(accounts) || !accounts.length || accounts.some((account) => !account?.email || !account?.password)) process.exit(1)' 2>/dev/null; then missing+=(DEMO_ADMIN_ACCOUNTS_INVALID); fi
           if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing production configuration: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "All deployment credentials are present in GitHub Environment: production."

  deploy-backend:
    name: Deploy Express backend
    needs: validate-deployment-config
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Link Railway service
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID" --json

      - name: Configure Railway runtime environment
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          DEMO_ADMIN_ACCOUNTS: ${{ secrets.DEMO_ADMIN_ACCOUNTS }}
          PUBLIC_BASE_URL: ${{ vars.BACKEND_PUBLIC_URL }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_PUBLIC_URL }}
        run: |
          oauth_args=()
          [ -n "$GOOGLE_CLIENT_ID" ] && oauth_args+=("GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID")
          [ -n "$GOOGLE_CLIENT_SECRET" ] && oauth_args+=("GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET")
          [ -n "$GITHUB_CLIENT_ID" ] && oauth_args+=("GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID")
          [ -n "$GITHUB_CLIENT_SECRET" ] && oauth_args+=("GITHUB_CLIENT_SECRET=$GITHUB_CLIENT_SECRET")
          [ -n "$DEMO_ADMIN_ACCOUNTS" ] && oauth_args+=("DEMO_ADMIN_ACCOUNTS=$DEMO_ADMIN_ACCOUNTS")
          railway variable set "GEMINI_API_KEY=$GEMINI_API_KEY" "MONGODB_URI=$MONGODB_URI" "RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID" "RAZORPAY_KEY_SECRET=$RAZORPAY_KEY_SECRET" "PUBLIC_BASE_URL=$PUBLIC_BASE_URL" "FRONTEND_ORIGIN=$FRONTEND_ORIGIN" "${oauth_args[@]}" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --skip-deploys --json
      - name: Deploy backend to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --detach

      - name: Wait for backend health check
        env:
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
        run: curl --fail --silent --show-error --retry 18 --retry-delay 10 --retry-all-errors "$BACKEND_PUBLIC_URL/health"

  deploy-frontend:
    name: Deploy React frontend
    needs: validate-deployment-config
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build with production API origin
        env:
          VITE_API_BASE_URL: ${{ vars.BACKEND_PUBLIC_URL }}
          VITE_PUBLIC_APP_ORIGIN: ${{ vars.FRONTEND_PUBLIC_URL }}
        run: npm run build

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Build Vercel deployment output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_BASE_URL: ${{ vars.BACKEND_PUBLIC_URL }}
          VITE_PUBLIC_APP_ORIGIN: ${{ vars.FRONTEND_PUBLIC_URL }}
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Publish Vercel deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
