name: Digital Heroes Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Required CI gate
    uses: ./.github/workflows/ci.yml

  validate-deployment-config:
    name: Validate deployment configuration
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check required deployment placeholders are configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
          FRONTEND_PUBLIC_URL: ${{ vars.FRONTEND_PUBLIC_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=(VERCEL_TOKEN)
          [ -n "$VERCEL_ORG_ID" ] || missing+=(VERCEL_ORG_ID)
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=(VERCEL_PROJECT_ID)
          [ -n "$RENDER_DEPLOY_HOOK_URL" ] || missing+=(RENDER_DEPLOY_HOOK_URL)
          [ -n "$BACKEND_PUBLIC_URL" ] || missing+=(BACKEND_PUBLIC_URL)
          [ -n "$FRONTEND_PUBLIC_URL" ] || missing+=(FRONTEND_PUBLIC_URL)
          [ -n "$GEMINI_API_KEY" ] || missing+=(GEMINI_API_KEY)
          [ -n "$MONGODB_URI" ] || missing+=(MONGODB_URI)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing production configuration: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "All deployment credentials are present in GitHub Environment: production."

  deploy-backend:
    name: Deploy Express backend
    needs: validate-deployment-config
    runs-on: ubuntu-latest
    environment: production
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify backend secrets are injected
        run: |
          test -n "$GEMINI_API_KEY"
          test -n "$MONGODB_URI"
          echo "Backend runtime secrets are present and masked."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"

      - name: Extract container tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Trigger Render backend deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for backend health check
        env:
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
        run: curl --fail --silent --show-error --retry 18 --retry-delay 10 --retry-all-errors "$BACKEND_PUBLIC_URL/health"

  deploy-frontend:
    name: Deploy React frontend
    needs: validate-deployment-config
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build with production API origin
        env:
          VITE_API_BASE_URL: ${{ vars.BACKEND_PUBLIC_URL }}
          VITE_PUBLIC_APP_ORIGIN: ${{ vars.FRONTEND_PUBLIC_URL }}
        run: npm run build

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Build Vercel deployment output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_BASE_URL: ${{ vars.BACKEND_PUBLIC_URL }}
          VITE_PUBLIC_APP_ORIGIN: ${{ vars.FRONTEND_PUBLIC_URL }}
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Publish Vercel deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
